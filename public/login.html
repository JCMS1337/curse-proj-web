<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация — СпортБронь.НСК</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Axios & SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Навигационная панель -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-lg text-slate-900 leading-tight">СпортБронь<span class="text-blue-600">.НСК</span></span>
          <span class="text-xs text-slate-600 font-medium">Муниципальный портал</span>
        </div>
      </a>

      <a href="/index.html" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        На главную
      </a>
    </div>
  </header>

  <!-- Центрированная карточка авторизации -->
  <main class="flex-grow flex items-center justify-center p-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-xl overflow-hidden">
      
      <!-- Переключатель вкладок (Вход / Регистрация) -->
      <div class="flex border-b border-slate-200 bg-slate-50/50 p-1">
        <button id="tab-login" class="flex-1 py-3 text-sm font-bold text-blue-600 border-b-2 border-blue-600 bg-white rounded-t-xl transition">
          Вход в систему
        </button>
        <button id="tab-register" class="flex-1 py-3 text-sm font-medium text-slate-500 hover:text-slate-800 transition">
          Регистрация
        </button>
      </div>

      <div class="p-6 sm:p-8">

        <!-- ФОРМА ВХОДА -->
        <div id="login-container">
          <div class="mb-6">
            <h2 class="text-xl font-bold text-slate-900">Добро пожаловать!</h2>
            <p class="text-xs text-slate-500 mt-1">Авторизуйтесь для оформления и управления бронированиями</p>
          </div>

          <form id="login-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Электронная почта (Email)</label>
              <input type="email" id="login-email" required placeholder="teacher@school22.ru" 
                     class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Пароль</label>
              <input type="password" id="login-password" required placeholder="••••••••" 
                     class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <button type="submit" id="login-submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-md transition">
              Войти
            </button>
          </form>

          <!-- Быстрый демо-вход для демонстрации на защите -->
          <div class="mt-8 pt-6 border-t border-slate-100">
            <span class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 text-center">
              Быстрый вход для защиты курсовой
            </span>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <button type="button" onclick="quickLogin('teacher@school22.ru', 'password123')" class="p-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-lg text-left transition">
                <span class="font-bold block">Учитель</span>
                <span class="text-[10px] text-slate-400">Лицей №22</span>
              </button>
              <button type="button" onclick="quickLogin('admin@school1.ru', 'password123')" class="p-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-lg text-left transition">
                <span class="font-bold block">Школа</span>
                <span class="text-[10px] text-slate-400">Гимназия №1</span>
              </button>
              <button type="button" onclick="quickLogin('manager@sportnsk.ru', 'password123')" class="p-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-lg text-left transition">
                <span class="font-bold block">Управляющий</span>
                <span class="text-[10px] text-slate-400">Объекты мэрии</span>
              </button>
              <button type="button" onclick="quickLogin('sysadmin@booking.nsk.ru', 'password123')" class="p-2 bg-slate-50 hover:bg-blue-50 hover:text-blue-600 border border-slate-200 rounded-lg text-left transition">
                <span class="font-bold block">Сисадмин</span>
                <span class="text-[10px] text-slate-400">Полный доступ</span>
              </button>
            </div>
          </div>
        </div>

        <!-- ФОРМА РЕГИСТРАЦИИ -->
        <div id="register-container" class="hidden">
          <div class="mb-6">
            <h2 class="text-xl font-bold text-slate-900">Регистрация в системе</h2>
            <p class="text-xs text-slate-500 mt-1">Создайте учетную запись преподавателя или представителя школы</p>
          </div>

          <form id="register-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">ФИО полностью</label>
              <input type="text" id="reg-fullname" required placeholder="Иванов Сергей Павлович" 
                     class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Электронная почта (Email)</label>
              <input type="email" id="reg-email" required placeholder="ivanov@school.ru" 
                     class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Номер телефона</label>
              <input type="tel" id="reg-phone" placeholder="+7 (913) 000-00-00" 
                     class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Образовательное учреждение</label>
              <select id="reg-organization" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                <option value="">Без привязки к ОУ (частный тренер)</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Роль в системе</label>
              <select id="reg-role" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                <option value="1">Учитель физкультуры / Тренер</option>
                <option value="2">Администрация школы (завуч/директор)</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Пароль (не менее 6 символов)</label>
              <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" 
                     class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <button type="submit" id="reg-submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-md transition">
              Зарегистрироваться
            </button>
          </form>
        </div>

      </div>
    </div>
  </main>

  <!-- Скрипты -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
