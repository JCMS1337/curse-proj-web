<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="stadiumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#heroGrad)"/>
  <circle cx="600" cy="300" r="400" fill="url(#stadiumGlow)"/>

  <!-- Field contour lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" fill="none">
    <rect x="100" y="80" width="1000" height="440" rx="30"/>
    <!-- Half line -->
    <line x1="600" y1="80" x2="600" y2="520"/>
    <!-- Center circle -->
    <circle cx="600" cy="300" r="90"/>
    <circle cx="600" cy="300" r="5" fill="#ffffff" fill-opacity="0.4"/>
    <!-- Penalty areas -->
    <rect x="100" y="180" width="160" height="240"/>
    <rect x="100" y="230" width="60" height="140"/>
    <rect x="940" y="180" width="160" height="240"/>
    <rect x="1040" y="230" width="60" height="140"/>
    <!-- Running track lanes outside -->
    <rect x="60" y="40" width="1080" height="520" rx="50" stroke-width="2" stroke-opacity="0.15"/>
    <rect x="40" y="20" width="1120" height="560" rx="70" stroke-width="2" stroke-opacity="0.1"/>
  </g>
</svg>