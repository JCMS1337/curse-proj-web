<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог спортивных площадок и интерактивная карта — SportBook</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Leaflet MarkerCluster CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <!-- Axios & SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    #map {
      height: 100%;
      min-height: 480px;
      width: 100%;
      border-radius: 1rem;
    }
  </style>
</head>
<body class="bg-[#f0fdf4] text-[#1f2937] min-h-screen flex flex-col antialiased">

  <!-- Навигационная панель -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-[#d1fae5]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#16a34a] text-white flex items-center justify-center shadow-md">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-lg text-slate-900 leading-tight">SportBook</span>
          <span class="text-xs text-[#166534] font-medium">Бронирование площадок</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
        <a href="/index.html" class="hover:text-[#16a34a] transition">Главная</a>
        <a href="/venues.html" class="text-[#16a34a] font-bold">Каталог площадок и карта</a>
        <a id="nav-cabinet-link" href="/cabinet.html" class="hidden hover:text-[#16a34a] transition">Мои бронирования</a>
        <a id="nav-admin-link" href="/admin.html" class="hidden hover:text-[#16a34a] transition">Управление</a>
      </nav>

      <div id="nav-auth-container"></div>
    </div>
  </header>

  <!-- Фильтры и поиск -->
  <div class="bg-white border-b border-[#d1fae5] py-4 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3 items-center">
        <!-- Текстовый поиск -->
        <div class="lg:col-span-3 relative">
          <input type="text" id="filter-search" placeholder="Поиск по названию или адресу..." 
                 class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#16a34a] focus:bg-white transition">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <!-- Вид спорта -->
        <div class="lg:col-span-2">
          <select id="filter-sport" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#16a34a] focus:bg-white transition">
            <option value="">Все виды спорта</option>
            <!-- Наполняется динамически -->
          </select>
        </div>

        <!-- Берег Оби -->
        <div class="lg:col-span-2">
          <select id="filter-bank" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#16a34a] focus:bg-white transition">
            <option value="">Оба берега</option>
            <option value="left">Левый берег</option>
            <option value="right">Правый берег</option>
          </select>
        </div>

        <!-- Район города -->
        <div class="lg:col-span-2">
          <select id="filter-district" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#16a34a] focus:bg-white transition">
            <option value="">Все районы</option>
            <option value="Центральный">Центральный район</option>
            <option value="Железнодорожный">Железнодорожный район</option>
            <option value="Заельцовский">Заельцовский район</option>
            <option value="Калининский">Калининский район</option>
            <option value="Дзержинский">Дзержинский район</option>
            <option value="Ленинский">Ленинский район</option>
            <option value="Кировский">Кировский район</option>
            <option value="Советский">Советский район</option>
            <option value="Октябрьский">Октябрьский район</option>
            <option value="Первомайский">Первомайский район</option>
          </select>
        </div>

        <!-- Переключатели (освещение, ограждение) -->
        <div class="lg:col-span-2 flex items-center gap-3 text-xs font-medium text-slate-700">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="filter-lighting" class="w-3.5 h-3.5 text-[#16a34a] rounded border-slate-300 focus:ring-[#16a34a]">
            <span>Свет</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="filter-fence" class="w-3.5 h-3.5 text-[#16a34a] rounded border-slate-300 focus:ring-[#16a34a]">
            <span>Ограждение</span>
          </label>
        </div>

        <!-- Кнопка сброса -->
        <div class="lg:col-span-1 text-right">
          <button id="filter-reset" class="w-full px-2.5 py-2 text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition">
            Сброс
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Основной контент: список и интерактивная карта -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-[calc(100vh-210px)] min-h-[600px]">
      
      <!-- Список площадок (левая колонка со скроллом) -->
      <div class="lg:col-span-5 flex flex-col h-full bg-white rounded-2xl border border-[#d1fae5] shadow-sm overflow-hidden">
        <div class="p-3.5 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-800 text-sm">Спортивные площадки</span>
            <span id="venues-count-badge" class="px-2.5 py-0.5 text-xs font-bold bg-[#dcfce7] text-[#166534] rounded-full">0</span>
          </div>
          <span class="text-xs text-slate-500">Кликните для перехода</span>
        </div>

        <div id="venues-list" class="flex-grow overflow-y-auto divide-y divide-slate-100 p-2 space-y-2">
          <!-- Карточки наполняются через venues.js -->
          <div class="p-8 text-center text-slate-400 text-sm">
            Загрузка площадок...
          </div>
        </div>
      </div>

      <!-- Карта Leaflet (правая колонка) -->
      <div class="lg:col-span-7 h-full relative rounded-2xl overflow-hidden border border-[#d1fae5] shadow-sm bg-slate-100">
        <div id="map"></div>
      </div>

    </div>
  </main>

  <!-- Скрипты -->
  <script src="/js/api.js"></script>
  <script src="/js/venues.js"></script>
</body>
</html>
