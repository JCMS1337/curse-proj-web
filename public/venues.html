<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог спортивных площадок и интерактивная карта — СпортБронь.НСК</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Axios & SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    #map {
      height: 100%;
      min-height: 450px;
      width: 100%;
      border-radius: 1rem;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- Навигационная панель -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-lg text-slate-900 leading-tight">СпортБронь<span class="text-blue-600">.НСК</span></span>
          <span class="text-xs text-slate-600 font-medium">Муниципальный портал</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
        <a href="/index.html" class="hover:text-blue-600 transition">Главная</a>
        <a href="/venues.html" class="text-blue-600 font-semibold">Каталог площадок и карта</a>
        <a id="nav-cabinet-link" href="/cabinet.html" class="hidden hover:text-blue-600 transition">Мои бронирования</a>
        <a id="nav-admin-link" href="/admin.html" class="hidden hover:text-blue-600 transition">Управление</a>
      </nav>

      <div id="nav-auth-container"></div>
    </div>
  </header>

  <!-- Фильтры и поиск -->
  <div class="bg-white border-b border-slate-200 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
        <!-- Текстовый поиск -->
        <div class="md:col-span-4 relative">
          <input type="text" id="filter-search" placeholder="Поиск по названию или адресу..." 
                 class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <!-- Вид спорта -->
        <div class="md:col-span-3">
          <select id="filter-sport" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            <option value="">Все виды спорта</option>
            <!-- Наполняется динамически -->
          </select>
        </div>

        <!-- Переключатели (освещение, ограждение) -->
        <div class="md:col-span-3 flex items-center gap-4 text-xs font-medium text-slate-700">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="filter-lighting" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <span>Освещение</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="filter-fence" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <span>Ограждение</span>
          </label>
        </div>

        <!-- Кнопка сброса -->
        <div class="md:col-span-2 text-right">
          <button id="filter-reset" class="px-3 py-2 text-xs font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-xl transition">
            Сбросить фильтры
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Основной контент: список и интерактивная карта -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-[calc(100vh-210px)] min-h-[600px]">
      
      <!-- Список площадок (левая колонка со скроллом) -->
      <div class="lg:col-span-5 flex flex-col h-full bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-800 text-sm">Площадки</span>
            <span id="venues-count-badge" class="px-2 py-0.5 text-xs font-semibold bg-blue-100 text-blue-700 rounded-full">0</span>
          </div>
          <span class="text-xs text-slate-600">Нажмите для перехода к объекту</span>
        </div>

        <div id="venues-list" class="flex-grow overflow-y-auto divide-y divide-slate-100 p-2 space-y-2">
          <!-- Карточки наполняются через venues.js -->
          <div class="p-8 text-center text-slate-400 text-sm">
            Загрузка площадок...
          </div>
        </div>
      </div>

      <!-- Карта Leaflet (правая колонка) -->
      <div class="lg:col-span-7 h-full relative rounded-2xl overflow-hidden border border-slate-200 shadow-sm bg-slate-100">
        <div id="map"></div>
      </div>

    </div>
  </main>

  <!-- Скрипты -->
  <script src="/js/api.js"></script>
  <script src="/js/venues.js"></script>
</body>
</html>
